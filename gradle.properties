# Project-wide Gradle settings.
# For more details, see https://developer.android.com/studio/build#gradle-files.

# JVM target for Kotlin and Java compilation.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Use AndroidX.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Allow Kotlin daemon.
kotlin.daemon.enabled=true

# Non-transitive R class.
android.nonTransitiveRClass=true
